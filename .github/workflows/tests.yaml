name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      # parser.py and const.py carry no Home Assistant or bleak imports, so the
      # decoding is testable without installing either.
      - run: pytest -q
