send_command:
  name: Send command
  description: >-
    Write one raw command to the hood's command characteristic. The command set
    is still being reverse-engineered, so this is deliberately raw rather than a
    light or fan service. Known codes are documented in captures/gatt.md.
  fields:
    code:
      name: Command code
      description: >-
        Command code, as an integer or a hex string. Known: 0x2002 fan raw
        speed, 0x2004 fan auto mode, 0x2005 light preset, 0x2006 light
        brightness, 0x2008 light auto mode, 0x2009 grease filter reset.
      required: true
      example: "0x2005"
      selector:
        text:
    param:
      name: Parameter
      description: >-
        Parameter for the command. Fan speed is 0-255 with 0 off; the filter
        reset takes 0.
      required: false
      default: 0
      example: 1
      selector:
        text:
    device_id:
      name: Device
      description: Only needed if more than one hood is set up.
      required: false
      selector:
        device:
          integration: safera

write_setting:
  name: Write setting
  description: >-
    Write one byte of the hood's 200-byte configuration block, then read it back
    to confirm. Low level on purpose — most of the block is still unmapped and
    it also holds stove-guard configuration. See captures/gatt.md.
  fields:
    offset:
      name: Offset
      description: >-
        Byte offset into the settings block, 0-199. Known: 86-92 are the Motor 1
        ventilation presets (levels 0-4 then boost), 93-99 the Motor 2 presets.
      required: true
      example: 87
      selector:
        text:
    value:
      name: Value
      description: Byte value to store, 0-255. Ventilation presets scale 0-254.
      required: true
      example: 23
      selector:
        text:
    device_id:
      name: Device
      description: Only needed if more than one hood is set up.
      required: false
      selector:
        device:
          integration: safera
